name: Deploy to GitHub Pages

# Publishes the production site to the root of the `gh-pages` branch, which is
# the Pages source. PR previews live in `pr-preview/` on the same branch, so a
# main deploy must NOT wipe them — see `clean-exclude` below and
# `pr-preview.yml`.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

# Push access to the gh-pages branch (via the default GITHUB_TOKEN).
permissions:
  contents: write

# Serialize main deploys; never cancel an in-flight publish mid-push.
concurrency:
  group: gh-pages-main
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          # Replace stale root assets, but keep the PR-preview subtree intact.
          clean: true
          clean-exclude: |
            pr-preview/
